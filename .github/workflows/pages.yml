name: Build and Deploy Natak

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build site
        run: |
          chmod +x build.sh
          ./build.sh Plays20260907.csv
          test -f natak/index.html

      # Group-only copy at an unlisted path, with a per-play edit form.
      # Both values are repo secrets so the public repo doesn't reveal them.
      - name: Build group site
        env:
          GROUP_PATH: ${{ secrets.GROUP_PATH }}
          FORM_CONFIG: ${{ secrets.FORM_CONFIG }}
        run: |
          if [ -n "$GROUP_PATH" ] && [ -n "$FORM_CONFIG" ]; then
            python3 generator.py Plays20260907.csv "natak/$GROUP_PATH" "$FORM_CONFIG"
            test -f "natak/$GROUP_PATH/index.html"
          else
            echo "GROUP_PATH / FORM_CONFIG not set; skipping group site"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: natak

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
